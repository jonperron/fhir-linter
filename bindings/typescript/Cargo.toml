[package]
name        = "fhir-node"
description = "Node.js bindings for the FHIR linter and validator (napi-rs)"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[lib]
name = "fhir_node"
crate-type = ["cdylib"]

[dependencies]
napi             = { workspace = true }
napi-derive      = { workspace = true }
fhir-definitions = { workspace = true }
fhir-parser      = { workspace = true }
fhir-validator   = { workspace = true }
fhir-linter      = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
