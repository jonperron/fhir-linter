[package]
name        = "fhir-fhirpath"
description = "FHIRPath 2.0 expression evaluator"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
readme      = "README.md"
# data/ holds the unmodified UCUM essence file and its notice; both must ship.
include     = ["/src", "/data", "/tests", "/README.md"]

[dependencies]
pest             = { workspace = true }
pest_derive      = { workspace = true }
thiserror        = { workspace = true }
indexmap         = { workspace = true }
fhir-parser      = { workspace = true }
regex-lite       = { workspace = true }
quick-xml        = { workspace = true }

[dev-dependencies]
# The official suite types its inputs with the R5 Registry, as the validator does.
fhir-definitions = { workspace = true }
