name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "**.rs"
      - "**/*.pest"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.rs"
      - "**/*.pest"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # PyO3 0.24 predates the runner's Python 3.14
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@v4
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      # Single test run: executes the suite and enforces the 80% line-coverage minimum.
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
