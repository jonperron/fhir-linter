name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "**.rs"
      - "bindings/python/**"
      - "bindings/typescript/**"
      - "**/*.pest"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.rs"
      - "bindings/python/**"
      - "bindings/typescript/**"
      - "**/*.pest"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@c114f6e1756596f56b6d3c93a9c0bbd6b5ec1154 # cargo-llvm-cov

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      # Single test run: executes the suite and enforces the 80% line-coverage minimum.
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      - run: pip install tox ruff

      - run: ruff check bindings/python && ruff format --check bindings/python

      - name: Run tox
        working-directory: bindings/python
        run: tox -e py

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      - name: Build and test
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build:debug
          npx tsc
          npm test
