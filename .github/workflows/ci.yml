name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "**.rs"
      - "bindings/python/**"
      - "bindings/typescript/**"
      - "**/*.pest"
      - "scripts/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.rs"
      - "bindings/python/**"
      - "bindings/typescript/**"
      - "**/*.pest"
      - "scripts/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@c114f6e1756596f56b6d3c93a9c0bbd6b5ec1154 # cargo-llvm-cov

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      # Single test run: executes the suite and enforces the 80% line-coverage minimum.
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      - run: pip install tox==4.65.0 ruff==0.17.5  # tox 4.65.0 still installs on Python 3.10

      - run: ruff check bindings/python && ruff format --check bindings/python

      - name: Run tox
        working-directory: bindings/python
        run: tox -e py

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache FHIR R5 definitions
        id: cache-fhir-r5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: definitions/r5
          key: fhir-r5-${{ hashFiles('scripts/download-definitions.sh') }}

      - name: Download FHIR R5 definitions
        if: steps.cache-fhir-r5.outputs.cache-hit != 'true'
        run: bash scripts/download-definitions.sh

      - name: Build and test
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build:debug
          npx tsc
          npm test
