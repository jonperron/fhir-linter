name: Release Please

on:
  push:
    branches: [main]
  # Manual retry, e.g. to publish an existing release to the registries.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (fhir-linter-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# GitHub keeps one pending run per group and replaces older pending ones, so
# push runs share one group and each retried tag gets its own: none can drop
# another. A retry racing a push for the same tag is safe: every publish step
# is idempotent.
concurrency:
  group: release-${{ github.event_name == 'push' && 'push' || inputs.tag }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    needs: release-please
    # release-please is skipped on a manual run; !cancelled() lets this job run anyway.
    # Only the reviewed main workflow may build, upload or publish.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  publish-npm:
    # release-please is listed for its tag output on push runs.
    needs: [release-please, release-assets]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@jonperron"

      # Publish the exact tarball attached to the release.
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          # A retry must not fail on a version already published.
          if npm view "@jonperron/fhir-linter@${TAG#fhir-linter-v}" version >/dev/null 2>&1; then
            echo "already published"; exit 0
          fi
          gh release download "$TAG" --pattern '*.tgz'
          npm publish ./*.tgz

  # Kept in this top-level workflow: PyPI trusted publishing does not support
  # reusable workflows. The PyPI publisher must name release-please.yml.
  publish-pypi:
    needs: release-assets
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    # Also restrict the pypi environment to the main branch (deployment rules).
    # Must match the environment of the PyPI trusted publisher.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The wheels and sdist the reusable workflow uploaded earlier in this run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
