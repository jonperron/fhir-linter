name: Release assets

# Called by release-please.yml: releases created with GITHUB_TOKEN never
# trigger `on: release` workflows.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag created by release-please
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag matches workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$TAG" = "fhir-linter-v$version" ] || { echo "tag $TAG != $version"; exit 1; }

      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build CLI
        run: |
          cargo build --release --locked -p fhir-cli --target "$TARGET"
          mkdir dist
          name="fhir-lint-$TAG-$TARGET"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/$name.zip" "./target/$TARGET/release/fhir-lint.exe"
          else
            tar -czf "dist/$name.tar.gz" -C "target/$TARGET/release" fhir-lint
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-cli-${{ matrix.target }}
          path: dist

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --out wheels -m bindings/python/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-wheels-${{ matrix.target }}
          path: wheels

      - name: Build Node addon
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build -- --target "$TARGET"

      # index.js / index.d.ts are generated by napi and identical on every target.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: napi-${{ matrix.target }}
          path: |
            bindings/typescript/*.node
            bindings/typescript/index.js
            bindings/typescript/index.d.ts
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-sdist
          path: dist

  release:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: napi-*
          path: bindings/typescript
          merge-multiple: true

      # One package carrying every platform's .node; index.js loads the local one.
      - name: Pack npm package
        working-directory: bindings/typescript
        run: npm pack --pack-destination ../../dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
