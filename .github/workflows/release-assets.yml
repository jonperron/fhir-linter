name: Release assets

# Called by release-please.yml: releases created with GITHUB_TOKEN never
# trigger `on: release` workflows.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag created by release-please
        required: true
        type: string

permissions:
  contents: read

env:
  # Exact toolchain for reproducible release builds; >= workspace rust-version.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag matches workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$TAG" = "fhir-linter-v$version" ] || { echo "tag $TAG != $version"; exit 1; }

      - uses: taiki-e/install-action@c114f6e1756596f56b6d3c93a9c0bbd6b5ec1154 # cargo-llvm-cov
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Oldest supported runner: the napi addon needs glibc >= 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # manylinux2014 tag 2026.11.07-1, pinned by digest.
            container: quay.io/pypa/manylinux2014_x86_64@sha256:62eeff30ef134a85ec0f97109e008a319b0315ca5e8a6d754ee771556c02622a
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.16.0
          manylinux: auto
          # Empty off Linux; the action only uses a container there.
          container: ${{ matrix.container }}
          # Installed by rustup inside the manylinux container too.
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          args: --release --locked --out wheels -m bindings/python/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-wheels-${{ matrix.target }}
          path: wheels

      - name: Build Node addon
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build -- --target "$TARGET"

      # index.js / index.d.ts are generated by napi and identical on every target.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: napi-${{ matrix.target }}
          path: |
            bindings/typescript/*.node
            bindings/typescript/index.js
            bindings/typescript/index.d.ts
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.16.0
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --out dist -m bindings/python/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-sdist
          path: dist

  release:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: napi-*
          path: bindings/typescript
          merge-multiple: true

      # One package carrying every platform's .node; index.js loads the local one.
      - name: Pack npm package
        working-directory: bindings/typescript
        run: npm pack --pack-destination ../../dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          # release-please creates a draft; publish only once every asset is attached.
          gh release edit "$TAG" --draft=false
