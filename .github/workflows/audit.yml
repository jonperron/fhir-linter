name: Audit

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly, so advisories published after the last PR still surface.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c114f6e1756596f56b6d3c93a9c0bbd6b5ec1154 # cargo-llvm-cov tag; tool: overrides its default
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - run: cargo audit
